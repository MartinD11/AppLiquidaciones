<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RematePro - Productos</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=4)}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .search-card { background: white; border-radius: 10px; padding: 15px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; margin-bottom: 20px; display: flex; align-items: center; }
        .search-card input { width: 100%; border: none; outline: none; padding: 5px 10px; font-size: 15px; color: #334155; background: transparent; }
        .search-card input::placeholder { color: #94a3b8; }

        .btn-nuevo { background: #111c2d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; transition: 0.2s;}
        .btn-nuevo:hover { background: #1e293b; }

        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-vendido { background: #d1fae5; color: #065f46; }
        .badge-novendido { background: #f1f5f9; color: #475569; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:30px; border-radius:10px; width:400px; position:relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close-btn { position:absolute; top:15px; right:20px; cursor:pointer; font-size:24px; color:#aaa; }
        .close-btn:hover { color:#333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-guardar, .btn-limpiar { padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; }
        .btn-guardar { background: #3b82f6; color: white; }
        .btn-limpiar { background: #e2e8f0; color: #4a5568; }

        .tabla-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; background: #f8f9fa; border-bottom: 2px solid #e2e8f0; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: #1a202c; }
        .btn-accion { cursor: pointer; background: none; border: none; margin-right: 10px; color: #a0aec0; font-size: 16px; }
        .btn-accion:hover { color: #3b82f6; }
        .btn-eliminar:hover { color: #e53e3e; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activePage='products')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/header :: header('Gestión de Productos')}"></div>

    <div class="content-area">

        <div th:if="${error != null}" style="background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <div th:if="${success != null}" style="background: #d1fae5; color: #065f46; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <i class="fa-solid fa-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <a th:href="@{/products/new}" class="btn-nuevo"><i class="fa-solid fa-plus"></i> Nuevo Producto</a>

            <form th:action="@{/products/import}" method="post" enctype="multipart/form-data" style="display: inline-block; margin-left: 10px;">
                <input type="file" name="file" accept=".xlsx" required style="display: none;" id="excelFileInput" onchange="this.form.submit()">
                <button type="button" class="btn-nuevo" style="background-color: #10b981;" onclick="document.getElementById('excelFileInput').click();">
                    <i class="fa-solid fa-file-excel"></i> Importar Excel
                </button>
            </form>
        </div>

        <div class="search-card">
            <i class="fa-solid fa-search" style="color: #a0aec0; margin-right: 10px;"></i>
            <input type="text" id="productTableSearch" placeholder="Buscar rápido por Lote, Nombre o Estado..." autocomplete="off">
        </div>

        <div class="tabla-card">
            <table th:if="${products != null && !products.isEmpty()}">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Lote</th>
                    <th>Nombre</th>
                    <th>Dueño / Cliente</th>
                    <th>Precio Base</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.lotNumber}">10</td>
                    <td th:text="${product.name}">TV LG</td>
                    <td th:text="${product.seller != null ? product.seller.name + ' ' + product.seller.lastName : '-'}">Juan Perez</td>
                    <td th:text="${product.basePrice != null ? '$' + product.basePrice : '-'}">$50000</td>
                    <td>
                        <span th:classappend="${product.status != null && product.status.name() == 'SOLD'} ? 'badge badge-vendido' : 'badge badge-novendido'"
                              th:text="${product.status != null && product.status.name() == 'SOLD' ? 'VENDIDO' : 'NO VENDIDO'}">
                        </span>
                    </td>
                    <td>
                        <button class="btn-accion btn-editar" title="Editar"
                                th:data-id="${product.id}"
                                th:data-name="${product.name}"
                                th:data-lot="${product.lotNumber}"
                                th:data-price="${product.basePrice}">
                            <i class="fa-solid fa-pen"></i>
                        </button>

                        <button class="btn-accion btn-eliminar btn-delete-modal" title="Eliminar"
                                th:data-id="${product.id}"
                                th:data-name="${product.name}">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${products == null || products.isEmpty()}" style="text-align: center; padding: 20px; color: #718096;">
                No hay productos cargados en el inventario.
            </div>
        </div>
    </div>
</div>

<div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <span id="closeModalBtn" class="close-btn">&times;</span>
        <h2>Editar Producto</h2>
        <form id="editForm" method="post">
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="editName" name="name" required>
            </div>
            <div class="form-group">
                <label>Lote Nro:</label>
                <input type="number" id="editLot" name="lotNumber">
            </div>
            <div class="form-group">
                <label>Precio Base:</label>
                <input type="number" step="0.01" id="editPrice" name="basePrice">
            </div>
            <button type="submit" class="btn-guardar" style="width: 100%;">Guardar Cambios</button>
        </form>
    </div>
</div>

<div id="deleteModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <h2 style="color: #ef4444; margin-bottom: 15px;">
            <i class="fa-solid fa-triangle-exclamation"></i> Confirmar Eliminación
        </h2>
        <p style="color: #4a5568; margin-bottom: 25px;">
            ¿Estás seguro de que deseas eliminar el producto <strong id="deleteProductName"></strong>? Esta acción no se puede deshacer.
        </p>
        <div style="display: flex; justify-content: space-between; gap: 10px;">
            <button type="button" id="closeDeleteModalBtn" class="btn-limpiar" style="flex: 1; justify-content: center;">Cancelar</button>
            <a id="confirmDeleteBtn" href="#" class="btn-guardar" style="background: #ef4444; flex: 1; text-decoration: none;">
                Sí, Eliminar
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/modal-products.js}"></script>
<script th:src="@{/js/inventory-filter.js}"></script>

</body>
</html>
