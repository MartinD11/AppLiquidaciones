<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Liquidación</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .ticket-container {
            max-width: 800px;
            margin: auto;
            background: white;
        }

        .totales-container {
            margin-top: 15px;
            font-weight: bold;
            color: #1e293b;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .fila-total {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f8fafc;
        }

        .fila-total.comision {
            color: #ef4444;
        }

        .fila-total.neto {
            border-top: 2px solid #e2e8f0;
            padding-top: 15px;
            font-size: 16px;
        }

        @media screen {
            body {
                background-color: #f1f5f9;
                padding: 40px;
            }

            .ticket-container {
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                max-height: 85vh;
                overflow-y: auto;
            }

            .print-btn {
                padding: 12px 30px;
                background-color: #3b82f6;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
                font-size: 16px;
                transition: background-color 0.2s ease;
            }

            .print-btn:hover {
                background-color: #2563eb;
            }
        }

        @media print {
            @page {
                margin: 0;
            }

            body {
                background-color: white;
                padding: 0;
            }

            .ticket-container {
                margin: 1.5cm;
                padding: 0;
                border-radius: 0;
                max-width: 100%;
            }

            table th, table td {
                font-size: 11px;
            }

            .totales-container {
                font-size: 13px;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .fila-total {
                padding: 6px 10px;
            }

            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="ticket-container">

    <header style="border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; padding-bottom: 10px;">
        <h2 style="color: #1e293b; margin-top: 0;">Liquidación: <span th:text="${liq.client.name + ' ' + liq.client.lastName}">Nombre Cliente</span></h2>
        <p style="color: #64748b; margin-bottom: 0;">Fecha del Remate: <span th:text="${liq.auction.date}">Fecha</span></p>
    </header>

    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead>
        <tr style="border-bottom: 1px solid #e2e8f0; color: #64748b;">
            <th style="padding: 10px; text-align: left;">Lote</th>
            <th style="padding: 10px; text-align: left;">Producto/Lote</th>
            <th style="padding: 10px; text-align: right;">Precio Base</th>
            <th style="padding: 10px; text-align: right;">Precio de Venta</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${liq.liquidatedProducts}" style="border-bottom: 1px solid #f8fafc;">
            <td style="padding: 10px;" th:text="${product.lotNumber}">Lote 1</td>
            <td style="padding: 10px;" th:text="${product.name}">Producto X</td>
            <td style="padding: 10px; text-align: right;" th:text="${'$' + #numbers.formatDecimal(product.getBasePrice(), 1, 'POINT', 2, 'COMMA')}">$0,00</td>
            <td style="padding: 10px; text-align: right;" th:text="${'$' + #numbers.formatDecimal(product.getSalePrice(), 1, 'POINT', 2, 'COMMA')}">$0,00</td>
        </tr>
        </tbody>
    </table>

    <div class="totales-container">
        <div class="fila-total">
            <span>Total Bruto</span>
            <span th:text="${'$' + #numbers.formatDecimal(liq.totalSold, 1, 'POINT', 2, 'COMMA')}">$0,00</span>
        </div>
        <div class="fila-total comision">
            <span>Comisión(-10%)</span>
            <span th:text="${'-$' + #numbers.formatDecimal(liq.retainedCommission, 1, 'POINT', 2, 'COMMA')}">-$0,00</span>
        </div>
        <div class="fila-total neto">
            <span>Neto a Pagar</span>
            <span th:text="${'$' + #numbers.formatDecimal(liq.netToPay, 1, 'POINT', 2, 'COMMA')}">$0,00</span>
        </div>
    </div>

    <div class="no-print" style="margin-top: 40px; text-align: center;">
        <button class="print-btn" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Imprimir Liquidación
        </button>
    </div>
</div>

</body>
</html>
