<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Liquidaciones - RematePro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos específicos de esta vista que no están en style.css -->
    <style>
        .filters-form { display: flex; gap: 20px; align-items: flex-end; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .summary-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .border-blue { border-left: 5px solid #3b82f6; }
        .border-green { border-left: 5px solid #10b981; }
        .border-orange { border-left: 5px solid #f59e0b; }

        .autocomplete-container { position: relative; }
        .autocomplete-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 5px 5px; max-height: 200px; overflow-y: auto; z-index: 1000; list-style: none; padding: 0; margin: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: none; }
        .autocomplete-results li { padding: 10px 12px; cursor: pointer; font-size: 14px; color: #334155; border-bottom: 1px solid #f1f5f9; }
        .autocomplete-results li:hover { background-color: #f8fafc; color: #3b82f6; font-weight: bold; }

        .modal-acciones { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activePage='liquidations')}"></div>

<div class="main-wrapper">

    <header class="top-header">
        <h2>Panel de Liquidaciones</h2>
        <div class="header-info no-print">
            <span th:text="${#calendars.format(#calendars.createNow(), 'dd MMM, yyyy')}"></span>
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        </div>
    </header>

    <div class="content-area">

        <div class="form-card" style="max-width: 100%; margin-top: 0; margin-bottom: 20px;">
            <form th:action="@{/liquidations}" method="get" class="filters-form" id="liquidationForm">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label>REMATE</label>
                    <select name="auctionId" onchange="this.form.submit()" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 5px; outline: none;">
                        <option value="">-- Seleccionar Remate --</option>
                        <option th:each="a : ${auctions}"
                                th:value="${a.id}"
                                th:text="${a.date}"
                                th:selected="${a.id == selectedAuctionId}"></option>
                    </select>
                </div>

                <div class="form-group autocomplete-container" style="flex: 1; margin-bottom: 0;">
                    <label>CLIENTE</label>
                    <input type="hidden" name="clientId" id="searchClientId" th:value="${selectedClientId}">

                    <th:block th:each="c : ${clients}">
                        <input th:if="${c.id == selectedClientId}" type="hidden" id="selectedClientName" th:value="${c.name + ' ' + c.lastName}">
                    </th:block>

                    <input type="text" id="clientSearch" placeholder="-- Todos los Clientes --" autocomplete="off">
                    <ul id="clientSearchResults" class="autocomplete-results"></ul>
                </div>

                <div th:if="${selectedAuctionId != null and !hasGenerated}" style="margin-bottom: 2px;">
                    <button type="submit" formaction="/liquidations/generate" formmethod="post" class="btn-submit" style="background-color: #f59e0b; width: auto;">
                        <i class="fa-solid fa-gears"></i> Generar
                    </button>
                </div>
            </form>
        </div>

        <div th:if="${summary != null}" class="summary-grid">
            <div class="summary-card border-blue">
                <p style="color: #64748b; margin: 0; font-size: 0.85rem; font-weight: bold;">TOTAL BRUTO</p>
                <h3 style="margin: 8px 0 0; font-size: 1.5rem; color: #1e293b;" th:text="${'$' + #numbers.formatDecimal(summary.totalSold, 1, 2)}">$0.00</h3>
            </div>
            <div class="summary-card border-green">
                <p style="color: #64748b; margin: 0; font-size: 0.85rem; font-weight: bold;">COMISIÓN (10%)</p>
                <h3 style="margin: 8px 0 0; font-size: 1.5rem; color: #10b981;" th:text="${'$' + #numbers.formatDecimal(summary.totalCommission, 1, 2)}">$0.00</h3>
            </div>
            <div class="summary-card border-orange">
                <p style="color: #64748b; margin: 0; font-size: 0.85rem; font-weight: bold;">NETO A PAGAR</p>
                <h3 style="margin: 8px 0 0; font-size: 1.5rem; color: #1e293b;" th:text="${'$' + #numbers.formatDecimal(summary.totalNetToPay, 1, 2)}">$0.00</h3>
            </div>
        </div>

        <div th:if="${liquidations != null and !liquidations.isEmpty()}" class="tabla-card">
            <table>
                <thead>
                <tr>
                    <th>CLIENTE</th>
                    <th>LOTES</th>
                    <th>TOTAL BRUTO</th>
                    <th>COMISIÓN</th>
                    <th>NETO A PAGAR</th>
                    <th>ESTADO</th>
                    <th class="no-print">ACCIONES</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="liq : ${liquidations}">
                    <td style="font-weight: bold;" th:text="${liq.client.name + ' ' + liq.client.lastName}"></td>
                    <td th:text="${liq.liquidatedProducts.size() + ' Lotes'}"></td>
                    <td th:text="${'$' + liq.totalSold}"></td>
                    <td style="color: #ef4444;" th:text="${'-$' + liq.retainedCommission}"></td>
                    <td style="font-weight: bold;" th:text="${'$' + liq.netToPay}"></td>
                    <td>
                        <span th:if="${liq.status.name() == 'PENDING'}" style="background-color: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">PENDIENTE</span>
                        <span th:if="${liq.status.name() == 'PAID'}" style="background-color: #d1fae5; color: #047857; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">PAGADA</span>
                    </td>
                    <td class="no-print">
                        <a th:href="@{/liquidations/view/{id}(id=${liq.id})}" class="btn-accion btn-editar" title="Ver Detalle"><i class="fa-solid fa-eye"></i></a>
                        <button th:if="${liq.status.name() == 'PENDING'}" type="button" th:attr="onclick=|abrirModalPago('${liq.id}', '${selectedAuctionId}')|" class="btn-accion" style="color: #10b981;" title="Marcar Pagada"><i class="fa-solid fa-check-circle"></i></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- Modal nativo de tu CSS -->
<div id="modalPago" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="cerrarModalPago()">&times;</span>
        <h3 style="margin-top:0;">Confirmar Pago</h3>
        <p>¿Marcar liquidación como pagada?</p>
        <form id="formModalPago" method="post" action="">
            <input type="hidden" name="auctionId" id="inputModalAuctionId">
            <div class="modal-acciones">
                <button type="button" class="btn-submit" style="background-color: #e2e8f0; color: #475569;" onclick="cerrarModalPago()">Cancelar</button>
                <button type="submit" class="btn-submit" style="background-color: #10b981;">
                    <i class="fa-solid fa-check"></i> Confirmar
                </button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/liquidations.js}"></script>
<script th:src="@{/js/liquidations-clients.js}"></script>

</body>
</html>
